[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stringart-engine"
version = "0.2.0"
description = "Moteur de génération String Art (prototype phases 1a-1b)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
  "opencv-python-headless>=4.8,<5",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "scikit-image>=0.22", "httpx>=0.27"]

[tool.setuptools]
packages = ["stringart"]

[tool.setuptools.package-data]
stringart = ["models/*.onnx", "models/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
