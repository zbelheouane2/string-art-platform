[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stringart-engine"
version = "0.1.0"
description = "Moteur de génération String Art (prototype phase 1a)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
  "opencv-python-headless>=4.8,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "scikit-image>=0.22"]

[tool.setuptools]
packages = ["stringart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
