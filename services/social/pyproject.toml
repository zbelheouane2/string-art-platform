[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deekra-social"
version = "0.1.0"
description = "Génération quotidienne de visuels (Gemini) et publication Facebook/Instagram (Meta Graph) pour DeeKra"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10",
  "requests>=2.31",
  "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["deekra_social"]

[tool.pytest.ini_options]
testpaths = ["tests"]
